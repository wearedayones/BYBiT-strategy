[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bybit-quant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pybit>=5.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["engine", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=engine --cov=strategies --cov-report=term-missing -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true
