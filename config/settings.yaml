symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

timeframe: "15"       # primary signal timeframe (minutes)
htf_timeframe: "60"   # higher-timeframe for context / level validation

# Liquidity sweep detection
liquidity:
  swing_lookback: 5          # bars each side to define a swing high/low
  equal_level_tolerance: 0.001  # 0.1% — two levels are "equal" if within this
  sweep_buffer: 0.0002       # price must pierce level by at least this fraction
  min_wick_ratio: 1.5        # wick must be at least 1.5x the candle body to count

# Event-driven bracket
bracket:
  pre_event_window_min: 45   # start bracket scan N minutes before event
  consolidation_bars: 20     # bars to scan for the pre-event range
  atr_ratio_threshold: 1.2   # range height <= 1.2 × ATR → "tight consolidation"
  entry_buffer_pct: 0.001    # entry just beyond range edge (0.1%)
  max_active_brackets: 2     # concurrent open bracket sets per symbol
  min_range_pct: 0.002       # ignore micro-ranges below 0.2%

# MCP server
mcp_server: "http://localhost:3000"
